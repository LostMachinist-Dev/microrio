<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Joystick Setup</title>

<style>
body {
    font-family: sans-serif;
    background: #202124;
    color: #e0e0e0;
    margin: 0;
    padding: 16px;
}
select, input, button {
    background: #303134;
    color: #e0e0e0;
    border: 1px solid #555;
    padding: 4px 6px;
    border-radius: 2px;
}
button { cursor: pointer; }
.hidden { display: none; }

#rawGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-top: 12px;
}
.byteCell {
    border: 1px solid #444;
    padding: 4px;
    font-size: 11px;
    background: #2b2c2f;
}
.byteHeader {
    font-weight: bold;
    margin-bottom: 4px;
}
.bitRow {
    display: flex;
    gap: 2px;
    justify-content: center;
}
.bitLed {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: #111;
}
.bitOn { background: #4caf50; }

.panel {
    margin-top: 16px;
    padding: 8px;
    border: 1px solid #444;
    background: #26272a;
}
.row { margin-bottom: 8px; }

.bitAssignRow {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
}
.bitAssignRow span { min-width: 50px; }
.hatLabel {
    font-size: 11px;
    opacity: 0.8;
}

#mappingReview {
    white-space: pre;
    font-family: monospace;
    margin-top: 16px;
    padding: 8px;
    background: #1c1d1f;
    border: 1px solid #444;
}
</style>
</head>

<body>

<h2>Joystick Setup</h2>

<div class="row">
    <label>Controller:
        <select id="controllerSelect"></select>
    </label>
</div>

<div id="rawGrid"></div>

<div class="panel">
    <h3>Mapping</h3>

    <div class="row">
        <label>Byte:
            <select id="byteSelect"></select>
        </label>
    </div>

    <div class="row">
        <label>Mapping Type:
            <select id="mapTypeSelect">
                <option value="axis">Axis</option>
                <option value="bitmask">Bitmask</option>
                <option value="mixed">Mixed</option>
            </select>
        </label>
    </div>

    <div id="axisConfig" class="hidden">
        <div class="row">
            <label>Axis:
                <select id="axisSelect"></select>
            </label>
        </div>
        <div class="row">
            <label>Min:<input id="axisMin" type="number" step="1" value="-100"></label>
            <label>Max:<input id="axisMax" type="number" step="1" value="100"></label>
            <label>Trim:<input id="axisTrim" type="number" step="1" value="0"></label>
        </div>
        <div class="row">
            <label><input id="axisExpoEnabled" type="checkbox"> Expo</label>
            <label>Expo:<input id="axisExpo" type="number" step="0.05" value="0.5" min="0" max="1"></label>
        </div>
        <div class="row">Mapped value: <span id="axisMappedValue">0</span></div>
    </div>

    <div id="bitmaskConfig" class="hidden">
        <div id="bitmaskBits"></div>
    </div>

    <div id="mixedConfig" class="hidden">
        <div class="row">
            <label>Hat start:<input id="hatStart" type="number" min="0" max="7" value="0"></label>
            <label>Hat:<select id="hatSelect"></select></label>
        </div>
        <div id="mixedBits"></div>
    </div>

    <div class="row">
        <button id="saveMappingBtn">Save Mapping</button>
    </div>
</div>

<h3>Current Mapping Overview</h3>
<div id="mappingReview"></div>
<!-- ========================= -->
<!--  TEMPLATES (STATIC HTML)  -->
<!-- ========================= -->

<!-- Bit row template used for BOTH bitmask and mixed modes -->
<template id="bitRowTemplate">
  <div class="bitAssignRow">
    <div class="bitLed"></div>
    <span class="bitLabel"></span>
    <span class="hatLabel hidden">(Hat)</span>
    <select class="buttonSelect"></select>
  </div>
</template>

<!-- End of templates -->

<!-- ========================= -->
<!--  BEGIN SCRIPT SECTION     -->
<!-- ========================= -->
<script>
/* All JavaScript begins here (Chunks 3–5 will continue inside this <script> tag) */
    /* ========================= */
/*   CORE HELPERS & MATH     */
/* ========================= */

let controllerList = [];
let controllerRaw = {};
let mapping = {};
let selectedController = null;
let selectedByte = 0;

/* Compute axis output with trim applied AFTER mapping */
function computeAxis(raw, min, max, trim, expoEnabled, expo) {
    if (min > max) [min, max] = [max, min];

    if (!expoEnabled) {
        const t = raw / 255;
        let scaled = min + (max - min) * t;
        let trimmed = scaled + trim;
        return Math.round(Math.max(min, Math.min(max, trimmed)));
    }

    let x = (raw / 127.5) - 1;
    let e = expo || 0;
    let expoVal = x * (1 - e) + (x * x * x) * e;
    let scaled = min + (max - min) * ((expoVal + 1) / 2);
    let trimmed = scaled + trim;
    return Math.round(Math.max(min, Math.min(max, trimmed)));
}

/* Get current byte value for selected controller/byte */
function getCurrentByteValue() {
    if (!selectedController) return 0;
    return (controllerRaw[selectedController] || [])[selectedByte] ?? 0;
}

/* Update axis preview display */
function updateAxisPreview() {
    if (!selectedController) {
        axisMappedValue.textContent = "0";
        return;
    }
    const raw = getCurrentByteValue();
    const out = computeAxis(
        raw,
        Number(axisMin.value) || 0,
        Number(axisMax.value) || 0,
        Number(axisTrim.value) || 0,
        axisExpoEnabled.checked,
        Number(axisExpo.value) || 0
    );
    axisMappedValue.textContent = String(out);
}

/* Update LEDs for bitmask or mixed mode */
function updateBitLEDs(container) {
    const val = getCurrentByteValue();
    container.querySelectorAll(".bitAssignRow").forEach((row, idx) => {
        const led = row.querySelector(".bitLed");
        if (val & (1 << idx)) led.classList.add("bitOn");
        else led.classList.remove("bitOn");
    });
}

/* Update the 8×8 raw byte grid */
function updateRawGrid(raw) {
    rawGrid.innerHTML = "";
    for (let i = 0; i < 64; i++) {
        const val = raw[i] ?? 0;
        const cell = document.createElement("div");
        cell.className = "byteCell";

        const header = document.createElement("div");
        header.className = "byteHeader";
        header.textContent = `Byte ${i} : ${val}`;
        cell.appendChild(header);

        const bits = document.createElement("div");
        bits.className = "bitRow";

        for (let b = 7; b >= 0; b--) {
            const led = document.createElement("div");
            led.className = "bitLed";
            if (val & (1 << b)) led.classList.add("bitOn");
            bits.appendChild(led);
        }

        cell.appendChild(bits);
        rawGrid.appendChild(cell);
    }
}

/* Unified render function */
function render() {
    updateAxisPreview();
    if (mapTypeSelect.value === "bitmask") updateBitLEDs(bitmaskBitsDiv);
    if (mapTypeSelect.value === "mixed")   updateBitLEDs(mixedBitsDiv);
}
/* ========================= */
/*      UI BUILDERS          */
/* ========================= */

function populateButtonDropdown(sel, selected) {
    sel.innerHTML = "";
    sel.append(new Option("Unused", ""));
    for (let i = 0; i < 16; i++) {
        sel.append(new Option("Button " + i, "Button " + i));
    }
    if (selected) sel.value = selected;
}

function buildBitRows(mode, container, existingButtons) {
    container.innerHTML = "";
    const val = getCurrentByteValue();
    const hatStart = Number(hatStartInput.value) || 0;
    const hatEnd = Math.min(hatStart + 3, 7);

    for (let b = 0; b < 8; b++) {
        const frag = bitRowTemplate.content.cloneNode(true);
        const row = frag.querySelector(".bitAssignRow");
        const led = frag.querySelector(".bitLed");
        const label = frag.querySelector(".bitLabel");
        const hatLbl = frag.querySelector(".hatLabel");
        const dd = frag.querySelector(".buttonSelect");

        label.textContent = "Bit " + b;
        if (val & (1 << b)) led.classList.add("bitOn");

        if (mode === "mixed" && b >= hatStart && b <= hatEnd) {
            hatLbl.classList.remove("hidden");
            dd.classList.add("hidden");
        } else {
            hatLbl.classList.add("hidden");
            dd.classList.remove("hidden");
            populateButtonDropdown(dd, existingButtons[b]);
            dd.dataset.bit = b;
        }

        container.appendChild(frag);
    }
}

/* ========================= */
/*     LOAD MAPPING ENTRY    */
/* ========================= */

function loadMappingForSelection() {
    const entry = (mapping[selectedController] || {})[selectedByte] || {};
    const type = entry.type || mapTypeSelect.value;

    mapTypeSelect.value = type;
    axisConfig.classList.toggle("hidden", type !== "axis");
    bitmaskConfig.classList.toggle("hidden", type !== "bitmask");
    mixedConfig.classList.toggle("hidden", type !== "mixed");

    if (type === "axis") {
        axisSelect.value = entry.axis || "Axis 0";
        axisMin.value = entry.min ?? -100;
        axisMax.value = entry.max ?? 100;
        axisTrim.value = entry.trim ?? 0;
        axisExpoEnabled.checked = entry.expoEnabled ?? false;
        axisExpo.value = entry.expo ?? 0.5;
    }

    if (type === "bitmask") {
        buildBitRows("bitmask", bitmaskBitsDiv, entry.buttons || {});
    }

    if (type === "mixed") {
        hatStartInput.value = entry.hatStart ?? 0;
        hatSelect.value = entry.hat || "Hat 0";
        buildBitRows("mixed", mixedBitsDiv, entry.buttons || {});
    }

    render();
}

/* ========================= */
/*     EVENT DELEGATION      */
/* ========================= */

document.body.addEventListener("change", e => {
    const el = e.target;

    if (el === controllerSelect) {
        selectedController = controllerSelect.value;
        initByteSelect();
        updateRawGrid(controllerRaw[selectedController] || []);
        loadMappingForSelection();
        return;
    }

    if (el === byteSelect) {
        selectedByte = Number(byteSelect.value);
        loadMappingForSelection();
        return;
    }

    if (el === mapTypeSelect) {
        loadMappingForSelection();
        return;
    }

    if (el.classList.contains("buttonSelect")) {
        // handled on save
        return;
    }
});

document.body.addEventListener("input", e => {
    const el = e.target;

    if (el === axisMin || el === axisMax || el === axisTrim ||
        el === axisExpo || el === axisExpoEnabled) {
        updateAxisPreview();
        return;
    }

    if (el === hatStartInput && mapTypeSelect.value === "mixed") {
        const entry = (mapping[selectedController] || {})[selectedByte] || {};
        buildBitRows("mixed", mixedBitsDiv, entry.buttons || {});
        return;
    }
});

/* ========================= */
/*        SAVE MAPPING       */
/* ========================= */

document.getElementById("saveMappingBtn").onclick = () => {
    if (!selectedController) {
        alert("Select controller");
        return;
    }

    const type = mapTypeSelect.value;
    let entry = { type };

    if (type === "axis") {
        entry.axis = axisSelect.value;
        entry.min = Number(axisMin.value);
        entry.max = Number(axisMax.value);
        entry.trim = Number(axisTrim.value);
        entry.expoEnabled = axisExpoEnabled.checked;
        entry.expo = Number(axisExpo.value);
    }

    if (type === "bitmask") {
        const buttons = {};
        bitmaskBitsDiv.querySelectorAll(".buttonSelect").forEach(sel => {
            if (sel.value) buttons[Number(sel.dataset.bit)] = sel.value;
        });
        entry.buttons = buttons;
    }

    if (type === "mixed") {
        const buttons = {};
        mixedBitsDiv.querySelectorAll(".buttonSelect").forEach(sel => {
            if (sel.value) buttons[Number(sel.dataset.bit)] = sel.value;
        });
        entry.hatStart = Number(hatStartInput.value) || 0;
        entry.hat = hatSelect.value;
        entry.buttons = buttons;
    }

    if (!mapping[selectedController]) mapping[selectedController] = {};
    mapping[selectedController][selectedByte] = entry;

    ws.send(JSON.stringify({
        type: "saveMapping",
        controllerID: selectedController,
        mapping: mapping[selectedController]
    }));

    alert("Mapping saved");
};
/* ========================= */
/*     WEBSOCKET HANDLER     */
/* ========================= */

ws.onmessage = evt => {
    const data = JSON.parse(evt.data);
    if (data.type === "raw") {
        const id = data.controllerID;
        const raw = data.raw;

        if (!controllerList.includes(id)) {
            controllerList.push(id);
            controllerSelect.append(new Option(id, id));
            if (!selectedController) {
                selectedController = id;
                controllerSelect.value = id;
                initByteSelect();
            }
        }

        controllerRaw[id] = raw;

        if (id === selectedController) {
            updateRawGrid(raw);
            render();
        }

        updateMappingReview();
    }
};

/* ========================= */
/*       INIT FUNCTIONS      */
/* ========================= */

function initByteSelect() {
    byteSelect.innerHTML = "";
    for (let i = 0; i < 64; i++) {
        byteSelect.append(new Option("Byte " + i, i));
    }
    selectedByte = 0;
    byteSelect.value = "0";
}

function initNameDropdowns() {
    axisSelect.innerHTML = "";
    for (let i = 0; i < 8; i++) {
        axisSelect.append(new Option("Axis " + i, "Axis " + i));
    }

    hatSelect.innerHTML = "";
    for (let i = 0; i < 4; i++) {
        hatSelect.append(new Option("Hat " + i, "Hat " + i));
    }
}

/* ========================= */
/*   MAPPING REVIEW PANEL    */
/* ========================= */

function updateMappingReview() {
    let out = "";

    const pad = (str, len) => (str + " ".repeat(len)).slice(0, len);

    for (const ctrlID of Object.keys(mapping)) {
        const ctrlMap = mapping[ctrlID];
        for (const byteStr of Object.keys(ctrlMap)) {
            const byte = Number(byteStr);
            const entry = ctrlMap[byte];

            if (entry.type === "axis") {
                const name = entry.axis || "Axis ?";
                out +=
                    pad(`${ctrlID}-${name}`, 28) +
                    pad(`type=axis`, 14) +
                    pad(`byte=${byte}`, 12) +
                    pad(`bit=-`, 14) +
                    pad(`min=${entry.min}`, 12) +
                    pad(`max=${entry.max}`, 12) +
                    pad(`trim=${entry.trim}`, 12) +
                    pad(`expo=${entry.expoEnabled}`, 14) +
                    pad(`expoVal=${entry.expoEnabled ? entry.expo.toFixed(2) : "-"}`, 12) +
                    "\n";
            }

            if (entry.type === "bitmask") {
                for (const bitStr of Object.keys(entry.buttons || {})) {
                    const bit = Number(bitStr);
                    const name = entry.buttons[bit];
                    out +=
                        pad(`${ctrlID}-${name}`, 28) +
                        pad(`type=bitmask`, 14) +
                        pad(`byte=${byte}`, 12) +
                        pad(`bit=${bit}`, 14) +
                        pad(`min=-`, 12) +
                        pad(`max=-`, 12) +
                        pad(`trim=-`, 12) +
                        pad(`expo=-`, 14) +
                        pad(`expoVal=-`, 12) +
                        "\n";
                }
            }

            if (entry.type === "mixed") {
                const hatStart = entry.hatStart ?? 0;
                const hatEnd = Math.min(hatStart + 3, 7);

                out +=
                    pad(`${ctrlID}-${entry.hat}`, 28) +
                    pad(`type=mixed`, 14) +
                    pad(`byte=${byte}`, 12) +
                    pad(`bit=${hatStart}-${hatEnd}`, 14) +
                    pad(`min=-`, 12) +
                    pad(`max=-`, 12) +
                    pad(`trim=-`, 12) +
                    pad(`expo=-`, 14) +
                    pad(`expoVal=-`, 12) +
                    "\n";

                for (const bitStr of Object.keys(entry.buttons || {})) {
                    const bit = Number(bitStr);
                    const name = entry.buttons[bit];
                    out +=
                        pad(`${ctrlID}-${name}`, 28) +
                        pad(`type=mixed`, 14) +
                        pad(`byte=${byte}`, 12) +
                        pad(`bit=${bit}`, 14) +
                        pad(`min=-`, 12) +
                        pad(`max=-`, 12) +
                        pad(`trim=-`, 12) +
                        pad(`expo=-`, 14) +
                        pad(`expoVal=-`, 12) +
                        "\n";
                }
            }
        }
    }

    mappingReview.textContent = out || "(no mappings yet)";
}

/* ========================= */
/*          STARTUP          */
/* ========================= */

initNameDropdowns();
initByteSelect();
updateMappingReview();

</script>
</body>
</html>
