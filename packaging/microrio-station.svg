  <rect x="7" y="12" width="50" height="34" rx="3" fill="#0c0c0c" stroke="#333" stroke-width="1"/>

  <!-- Graticule -->
  <g stroke="#242424" stroke-width="0.6">
    <path d="M7 20.5h50M7 29h50M7 37.5h50"/>
    <path d="M19.5 12v34M32 12v34M44.5 12v34"/>
  </g>

  <!-- Traces, using the scope colours from 6Achannels.ino -->
