  <rect x="18" y="51" width="8" height="6" rx="1.5" fill="#300" stroke="#600" stroke-width="0.8"/>
  <rect x="29" y="51" width="8" height="6" rx="1.5" fill="#300" stroke="#600" stroke-width="0.8"/>
  <rect x="40" y="51" width="17" height="6" rx="1.5" fill="#222" stroke="#555" stroke-width="0.8"/>
</svg>
